<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saatvik Restaurant – Menu</title>
  <meta name="theme-color" content="#FBF6EF">
</head>
<body style="margin:0;background:#FBF6EF;font-family:Calibri,Carlito,'Segoe UI',Roboto,Arial,sans-serif;color:#3D1C02">
  <p id="ld" style="text-align:center;padding:64px 16px;margin:0">Loading menu…</p>
  <noscript><p style="text-align:center;padding:16px">Please enable JavaScript to view the menu.</p></noscript>
<script>
/* =====================================================================
 * LOCKED LOADER – Saatvik QR Menu (stsmenu.github.io)
 * Printed QR codes point to https://stsmenu.github.io/ (also ?menu=restaurant / ?menu=room).
 * Design + menu are loaded LIVE from the Apps Script deployment below,
 * so every update deployed in Apps Script shows here automatically.
 * DO NOT edit this file or change the deployment ID.
 * ===================================================================== */
(function () {
  var BASE = 'https://script.google.com/macros/s/AKfycbz6ZzjD4owP5h8hbPYA8gxgroJHqvOVV6rLS1LJODQpLmgy-ta9Al93xV_Wn5Ur5Hk/exec';
  var q = new URLSearchParams(location.search).get('menu');
  var menu = (q === 'room' || q === 'restaurant') ? q : '';
  function get(url) {
    return fetch(url + '&t=' + Date.now(), { credentials: 'omit', cache: 'no-store' })
      .then(function (r) { return r.json(); });
  }
  // Auto-refresh support: the page calls google.script.run.getPublicMenu() – answer it from the JSON API.
  var shim = '<script>window.google = { script: { run: { withSuccessHandler: function (ok) { return { getPublicMenu: function () {' +
    'fetch("' + BASE + '?api=menu&t=" + Date.now(), { credentials: "omit", cache: "no-store" })' +
    '.then(function (r) { return r.json(); }).then(function (d) { ok({ ok: !d.error, data: d }); }).catch(function () {});' +
    '} }; } } } };<\/script>';
  var head = '<meta name="viewport" content="width=device-width, initial-scale=1"><title>Saatvik Restaurant – Menu</title>' + shim;
  function show(d) {
    if (!d || !d.html) throw new Error('no page');
    var html = d.html.replace(/<head>/i, '<head>' + head);
    document.open(); document.write(html); document.close();
  }
  function fail() {
    document.getElementById('ld').textContent = 'Menu is temporarily unavailable. Please check your internet connection or ask our staff for assistance.';
  }
  var url = BASE + '?api=site' + (menu ? '&menu=' + menu : '');
  get(url).then(show).catch(function () {
    setTimeout(function () { get(url).then(show).catch(fail); }, 1500);
  });
})();
</script>
</body>
</html>
